version: "2"

run:
  timeout: 10m
  tests: true
  go: "1.25"
  modules-download-mode: readonly

linters:
  default: none

  enable:
    # --- correctness / bugs ---
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - errorlint
    - errchkjson
    - nilerr
    - nilnil
    - contextcheck
    - copyloopvar
    - intrange
    - durationcheck
    - makezero
    - reassign
    - asciicheck
    - bidichk
    - wastedassign
    - usestdlibvars
    - gocheckcompilerdirectives
    - predeclared
    - gosec
    - loggercheck

    # --- style / quality ---
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
    - goconst
    - whitespace
    - nolintlint
    - gocyclo
    - nakedret
    - prealloc

    # --- tests ---
    - tparallel
    - paralleltest
    - thelper
    - testableexamples

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      exclude-functions:
        # Documented to never error — exist only to satisfy io.Writer.
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).Write
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - (*strings.Builder).WriteString

    govet:
      enable-all: true
      disable:
        - fieldalignment   # too pedantic for test/struct-heavy code

    staticcheck:
      checks: ["all"]

    revive:
      enable-all-rules: false
      rules:
        - { name: blank-imports }
        - { name: context-as-argument }
        - { name: context-keys-type }
        - { name: dot-imports }
        - { name: error-naming }
        - { name: error-return }
        - { name: error-strings }
        - { name: errorf }
        - { name: if-return }
        - { name: increment-decrement }
        - { name: var-naming }
        - { name: var-declaration }
        - { name: range }
        - { name: receiver-naming }
        - { name: time-naming }
        - { name: unexported-return }
        - { name: indent-error-flow }
        - { name: empty-block }
        - { name: superfluous-else }
        - { name: unreachable-code }
        - { name: redefines-builtin-id }
        - { name: early-return }
        - { name: bool-literal-in-expr }
        - { name: unnecessary-stmt }
        - { name: struct-tag }
        - { name: modifies-value-receiver }
        - { name: confusing-naming }
        - { name: confusing-results }
        - { name: exported }
        - { name: package-comments }

    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - whyNoLint
        - unnamedResult
        - hugeParam       # opt in case-by-case after benchmarking

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104   # overlaps with errcheck
        - G304   # file path taint — n/a for this library
        - G107   # variable URL in http.Do — by design: consumer chooses endpoint
        - G704   # SSRF via taint analysis — same: consumer chooses endpoint

    gocyclo:
      min-complexity: 20

    goconst:
      min-len: 4
      min-occurrences: 4
      ignore-tests: true

    nakedret:
      max-func-lines: 30

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    unparam:
      check-exported: false

    misspell:
      locale: US

  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Tests get a bit more rope where the noise/value ratio is poor.
      - path: _test\.go
        linters:
          - gocyclo
          - goconst
          - gosec
          - noctx
          - unparam
          - errcheck

      # Internal decoder is intentionally complex; cap higher.
      - path: internal/decode/
        linters: [gocyclo]

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
  settings:
    gofumpt:
      extra-rules: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/llehouerou/gqlclient)
      custom-order: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
  show-stats: true
  sort-order: [linter, file]
